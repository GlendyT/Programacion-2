spring.application.name=api-mascotas
server.port=${PORT:8080}

# Configura estas variables de entorno antes de iniciar la API.
# ORACLE_JDBC_URL debe ser la cadena de conexion TLS copiada de Oracle Cloud.
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_DB_USER}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.sql.init.mode=never
